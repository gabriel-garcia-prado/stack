# Portable, vendor-neutral deployment: this same compose file runs locally and
# on any Docker host (Fly.io, Railway, Render, a VPS, ECS, Cloud Run, ...).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        VITE_APP_API_URL: ${VITE_APP_API_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    environment:
      DATABASE_CONNECTION_STRING: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/postgres
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
